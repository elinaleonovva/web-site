<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточки: Итоговый тест (152 вопроса)</title>
<style>
  :root {
    --bg:#0b1020; --card:#121a33; --text:#e6e8ef; --muted:#a7acc0; --accent:#7aa2ff;
    --ok:#22c55e; --bad:#ef4444; --border:#243055;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }
  header { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; margin-bottom: 14px; }
  h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .pill { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border:1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .qhead { display:flex; align-items:flex-start; justify-content:space-between; gap: 10px; }
  .qtitle { font-size: 15px; font-weight: 700; margin:0 0 6px 0; }
  .qtext { margin: 0; color: var(--text); line-height: 1.35; }
  .muted { color: var(--muted); }
  .opts { margin-top: 12px; display:flex; flex-direction:column; gap: 10px; }
  label.opt { display:flex; gap:10px; align-items:flex-start; padding: 10px 12px; border:1px solid var(--border); border-radius: 12px; cursor:pointer; }
  label.opt:hover { border-color: rgba(122,162,255,.55); }
  input[type="radio"], input[type="checkbox"] { margin-top: 2px; transform: scale(1.1); }
  .opt.correct { border-color: rgba(34,197,94,.65); background: rgba(34,197,94,.08); }
  .opt.wrong { border-color: rgba(239,68,68,.65); background: rgba(239,68,68,.08); }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
  button { border:1px solid var(--border); background: rgba(255,255,255,.02); color: var(--text);
           padding: 10px 12px; border-radius: 12px; cursor:pointer; font-weight: 600; }
  button:hover { border-color: rgba(122,162,255,.55); }
  button.primary { border-color: rgba(122,162,255,.8); background: rgba(122,162,255,.15); }
  button.danger { border-color: rgba(239,68,68,.8); background: rgba(239,68,68,.12); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  input[type="number"] { width: 92px; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text); }
  .status { margin-top: 12px; font-weight: 700; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .answerBox { margin-top: 10px; padding: 10px 12px; border-radius: 12px; border:1px dashed var(--border); color: var(--muted); }
  .barwrap { width: 100%; height: 10px; background: rgba(255,255,255,.06); border-radius: 999px; overflow:hidden; border:1px solid var(--border); }
  .bar { height:100%; width:0%; background: rgba(122,162,255,.85); }
  table.match { width:100%; border-collapse: collapse; margin-top: 12px; }
  table.match td, table.match th { border: 1px solid var(--border); padding: 10px; vertical-align: top; }
  table.match th { text-align:left; color: var(--muted); font-weight: 700; background: rgba(255,255,255,.03); }
  select { width:100%; padding: 8px 10px; border-radius: 10px; border:1px solid var(--border); background: rgba(255,255,255,.03); color: var(--text); }
  .small { font-size: 12px; }
  .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 2px 6px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Карточки: Итоговый тест (152 вопроса)</h1>
      <div class="pill">Оффлайн HTML. Ответы и прогресс сохраняются в браузере (localStorage).</div>
    </div>
    <div class="row">
      <div class="pill">Переход к №</div>
      <input id="jump" type="number" min="1" max="152" value="1">
      <button id="jumpBtn" class="primary">Перейти</button>
    </div>
  </header>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div class="pill" id="progressText"></div>
      <div class="pill" id="scoreText"></div>
    </div>
    <div class="barwrap" style="margin-top:10px;"><div class="bar" id="bar"></div></div>
  </div>

  <div style="height:12px;"></div>

  <div class="card" id="qCard"></div>

  <div class="controls">
    <button id="prevBtn">← Назад</button>
    <button id="nextBtn">Вперёд →</button>
    <button id="checkBtn" class="primary">Проверить</button>
    <button id="showBtn">Показать ответ</button>
    <button id="resetBtn" class="danger">Сбросить прогресс</button>
  </div>

  <div class="pill small" style="margin-top:10px;">
    Подсказка: клавиши <span class="kbd">←</span>/<span class="kbd">→</span> — навигация, <span class="kbd">Enter</span> — проверить.
  </div>
</div>

<script>
const quiz = [{"id": 1, "type": "single", "question": "Что в терминологии реляционной модели данных соответствует понятию «кортеж»?", "options": ["Строка таблицы", "Множество всех таблиц в базе данных", "Заголовок столбца", "Программный интерфейс доступа к данным"], "correct": [0]}, {"id": 2, "type": "multi", "question": "Какие результаты могут принимать логические выражения в SQL в связи с поддержкой NULL-значений?", "options": ["UNKNOWN (неизвестно)", "VOID (пустота)", "FALSE (ложь)", "TRUE (истина)"], "correct": [0, 2, 3]}, {"id": 3, "type": "single", "question": "В чем заключается особенность использования ROWS при определении границ окна?", "options": ["Позволяет изменять данные в таблице через оконный интерфейс", "Основывается на физическом положении строк относительно текущей строки", "Включает в себя значения в определенном диапазоне значений столбца сортировки", "Автоматически удаляет пустые строки из текущего окна"], "correct": [1]}, {"id": 4, "type": "multi", "question": "Какие условия обязательны для того, чтобы представление было автоматически изменяемым?", "options": ["Обязательное наличие оператора GROUP BY в определении", "Отсутствие агрегатных функций в списке выборки", "Использование оператора DISTINCT на верхнем уровне", "Список FROM содержит одну таблицу или изменяемое представление"], "correct": [1, 3]}, {"id": 5, "type": "matching", "question": "Установите соответствие между категорией оконной функции и её основным назначением.", "left": ["Агрегатные", "Ранжирующие", "Функции смещения"], "rightOptions": ["Ранжируют значение для каждой строки в окне", "Позволяют обращаться к разным строкам окна", "Выполняют арифметические вычисления на наборе данных"], "correctMap": [2, 0, 1], "pairs": [["Агрегатные", "Выполняют арифметические вычисления на наборе данных"], ["Ранжирующие", "Ранжируют значение для каждой строки в окне"], ["Функции смещения", "Позволяют обращаться к разным строкам окна"]]}, {"id": 6, "type": "single", "question": "Чем отличаются монопольные блокировки (X-блокировки) от разделяемых?", "options": ["Они используются только для выполнения операций чтения", "Они автоматически шифруют заблокированные данные на диске", "Они запрещают любой взаимный доступ к объекту данных", "Они позволяют нескольким пользователям одновременно изменять строку"], "correct": [2]}, {"id": 7, "type": "single", "question": "Каков общий синтаксис оператора для соединения таблиц в языке SQL?", "options": ["SELECT поля FROM таблица_1 MERGE таблица_2 USING условие", "SELECT поля FROM таблица_1 AND таблица_2 ON условие", "SELECT поля FROM таблица_1 JOIN таблица_2 ON условие", "SELECT поля FROM таблица_1 WHERE таблица_2 = условие"], "correct": [2]}, {"id": 8, "type": "multi", "question": "Какие параметры можно передать в функцию LAG для настройки выборки?", "options": ["Значение по умолчанию", "Смещение в строках", "Пароль администратора", "Поле таблицы"], "correct": [0, 1]}, {"id": 9, "type": "multi", "question": "Какие операторы допустимы в предложении WHERE для реализации условий отбора по диапазону или шаблону?", "options": ["IN для сортировки по алфавиту", "BETWEEN для поиска внутри интервала", "AS для определения группы", "LIKE для сравнения со строковым шаблоном"], "correct": [1, 3]}, {"id": 10, "type": "matching", "question": "Установите соответствие между элементами работы с процедурами и их назначением.", "left": ["INOUT", "IN", "OUT", "CALL"], "rightOptions": ["Передача и изменение данных", "Передача значений в процедуру", "Оператор вызова процедуры", "Возврат значений после выполнения"], "correctMap": [0, 1, 3, 2], "pairs": [["INOUT", "Передача и изменение данных"], ["IN", "Передача значений в процедуру"], ["OUT", "Возврат значений после выполнения"], ["CALL", "Оператор вызова процедуры"]]}, {"id": 11, "type": "single", "question": "Какая секция оператора MERGE выполняется, если условие ON обнаружило соответствие между строками источника и цели?", "options": ["WHEN NOT MATCHED", "ON SUCCESS", "WHEN MATCHED", "IF EXISTS"], "correct": [2]}, {"id": 12, "type": "multi", "question": "Какие строковые функции предназначены для удаления пробелов в SQL?", "options": ["REPLACE()", "TRIM()", "LTRIM()", "STRIP()"], "correct": [1, 2]}, {"id": 13, "type": "single", "question": "К какому типу оконных функций относятся LAG и LEAD?", "options": ["Функции удаления дубликатов", "Функции ранжирования", "Функции смещения", "Агрегатные функции"], "correct": [2]}, {"id": 14, "type": "multi", "question": "В каких сферах деятельности применяется хранение двоичных данных?", "options": ["Облачные хранилища для документов разных форматов", "Системы автоматической генерации текста", "Видеохостинги для размещения видеофайлов", "Библиотечные фонды с бумажными носителями"], "correct": [0, 2]}, {"id": 15, "type": "matching", "question": "Установите соответствие между оператором DML и его назначением", "left": ["UPDATE", "MERGE", "INSERT", "DELETE"], "rightOptions": ["Добавление записей в таблицу", "Удаление записей из таблицы", "Обновление данных в столбце", "Слияние нескольких операций модификации"], "correctMap": [2, 3, 0, 1], "pairs": [["UPDATE", "Обновление данных в столбце"], ["MERGE", "Слияние нескольких операций модификации"], ["INSERT", "Добавление записей в таблицу"], ["DELETE", "Удаление записей из таблицы"]]}, {"id": 16, "type": "single", "question": "Какое выражение CASE используется только для проверки равенства входного выражения набору значений?", "options": ["Поисковое выражение CASE", "Агрегатное выражение CASE", "Рекурсивное выражение CASE", "Простое выражение CASE"], "correct": [3]}, {"id": 17, "type": "multi", "question": "Какие этапы запроса должны завершиться перед расчетом оконных функций?", "options": ["Группировка данных GROUP BY", "Фильтрация строк WHERE", "Очистка кэша процессора", "Сортировка ORDER BY"], "correct": [0, 1]}, {"id": 18, "type": "single", "question": "Какой результат формирует операция CROSS JOIN?", "options": ["Объединение уникальных записей из двух таблиц по первичному ключу", "Пересечение наборов данных с сохранением только совпадающих индексов", "Список всех доступных атрибутов и метаданных соединяемых отношений", "Каждая строка из первой таблицы соединяется с каждой строкой из второй таблицы"], "correct": [3]}, {"id": 19, "type": "multi", "question": "Какие утверждения верны для операции LEFT ANTI-JOIN?", "options": ["Исключает строки, имеющие совпадения в правой таблице", "Возвращает только те строки из левой таблицы, для которых нет соответствий в правой", "Физически удаляет несовпадающие данные с жесткого диска", "Может быть реализована через LEFT JOIN с условием B.KEY IS NULL"], "correct": [0, 1, 3]}, {"id": 20, "type": "multi", "question": "В чем заключаются различия между UNION и UNION ALL в SQL?", "options": ["Обе операции требуют совместимости типов данных", "UNION ALL сохраняет все дубликаты строк", "UNION исключает дубликаты из результирующего набора", "UNION ALL автоматически сортирует данные по первичному ключу"], "correct": [1, 2]}, {"id": 21, "type": "single", "question": "Что возвращает оператор INNER JOIN при объединении двух таблиц?", "options": ["Все строки из левой таблицы и только совпадающие из правой", "Только те строки, которые имеют совпадение в заданном критерии в обеих таблицах", "Только те строки, которые не имеют совпадений ни в одной из таблиц", "Все строки из обеих таблиц вне зависимости от наличия совпадений"], "correct": [1]}, {"id": 22, "type": "multi", "question": "Как можно реализовать вещественное деление в PostgreSQL, чтобы избежать отбрасывания дробной части?", "options": ["Использовать запись числа с точкой (например, 5./3)", "Сделать один из операндов вещественным с помощью CAST", "Использовать оператор двойного деления //", "Использовать только целочисленные операнды"], "correct": [0, 1]}, {"id": 23, "type": "matching", "question": "Установите соответствие между строковой функцией и её назначением", "left": ["SUBSTRING()", "TRIM()", "REPLACE()", "CONCAT()"], "rightOptions": ["Объеди } else if (state.lastIndex !== undefined) {
  const safeOld = Math.min(Math.max(state.lastIndex, 0), quiz.length - 1);
  const oldQid = quiz[safeOld].id;
  const pos = state.order.indexOf(oldQid);
  if (pos >= 0) idx = pos;
}


function saveState() {
  state.lastIndex = idx;
  state.lastQid = currentQ().id;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}


function arraysEqual(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  for (let i=0; i<a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

function getSelectedOptionIndices() {
  const inputs = Array.from(document.querySelectorAll('input[name="opt"]'));
  const sel = [];
  inputs.forEach((el) => {
    if (el.checked) sel.push(parseInt(el.value,10));
  });
  sel.sort((x,y)=>x-y);
  return sel;
}

function setOptionHighlights(q, selected, showCorrectOnly=false) {
  const labels = Array.from(document.querySelectorAll("label.opt"));
  labels.forEach((lab) => {
    lab.classList.remove("correct","wrong");
    const v = parseInt(lab.getAttribute("data-idx"),10);
    const isCorrect = q.correct.includes(v);
    const isSel = selected.includes(v);
    if (showCorrectOnly) {
      if (isCorrect) lab.classList.add("correct");
      return;
    }
    if (isCorrect) lab.classList.add("correct");
    if (isSel && !isCorrect) lab.classList.add("wrong");
  });
}

function render() {
  const q = currentQ();
  document.getElementById("jump").value = q.id;
  document.getElementById("progressText").textContent = `Вопрос ${idx + 1} из ${quiz.length} (№${q.id})`;
  document.getElementById("bar").style.width = `${Math.round(((idx + 1) / quiz.length) * 100)}%`;

  // score
  let attempted = 0, correct = 0;
  for (const item of quiz) {
    const a = state.answers[item.id];
    if (a !== undefined) {
      attempted++;
      const c = state.checked[item.id];
      if (c === true) correct++;
    }
  }
  document.getElementById("scoreText").textContent = `Результат: ${correct}/${attempted} (верно/попытки)`;

  const card = document.getElementById("qCard");
  card.innerHTML = "";

  const head = document.createElement("div");
  head.className = "qhead";
  head.innerHTML = `
    <div>
      <div class="qtitle">Вопрос ${q.id}</div>
      <p class="qtext">${escapeHtml(q.question)}</p>
      <div class="pill small muted" style="margin-top:8px;">Тип: ${q.type === "matching" ? "соответствие" : (q.type === "multi" ? "несколько вариантов" : "один вариант")}</div>
    </div>
  `;
  card.appendChild(head);

  const status = document.createElement("div");
  status.id = "status";
  card.appendChild(status);

  const answerBox = document.createElement("div");
  answerBox.id = "answerBox";
  answerBox.className = "answerBox";
  answerBox.style.display = "none";
  card.appendChild(answerBox);

  if (q.type === "matching") {
    const tbl = document.createElement("table");
    tbl.className = "match";
    tbl.innerHTML = `<thead><tr><th style="width:50%;">Левая часть</th><th>Правая часть</th></tr></thead>`;
    const tb = document.createElement("tbody");
    q.left.forEach((leftText, i) => {
      const tr = document.createElement("tr");
      const tdL = document.createElement("td");
      tdL.textContent = leftText;
      const tdR = document.createElement("td");
      const sel = document.createElement("select");
      sel.setAttribute("data-row", String(i));
      const opt0 = document.createElement("option");
      opt0.value = "";
      opt0.textContent = "— выберите вариант —";
      sel.appendChild(opt0);
      const rOrder = getMatchOrder(q);
      rOrder.forEach((origIdx) => {
        const ro = q.rightOptions[origIdx];
        const o = document.createElement("option");
        o.value = String(origIdx);
        o.textContent = ro;
        sel.appendChild(o);
      });
      const saved = state.answers[q.id]?.[i];
      if (saved !== undefined && saved !== null) sel.value = String(saved);
      sel.addEventListener("change", () => {
        const arr = state.answers[q.id] || Array(q.left.length).fill(null);
        arr[i] = sel.value === "" ? null : parseInt(sel.value,10);
        state.answers[q.id] = arr;
        saveState();
      });
      tdR.appendChild(sel);
      tr.appendChild(tdL);
      tr.appendChild(tdR);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    card.appendChild(tbl);

    // if previously checked, show status
    if (state.checked[q.id] !== undefined) {
      showResultForCurrent(false);
    }
  } else {
    const opts = document.createElement("div");
    opts.className = "opts";
    const isMulti = (q.type === "multi");
    const oOrder = getOptionOrder(q);
    oOrder.forEach((origIdx) => {
      const optText = q.options[origIdx];
      const lab = document.createElement("label");
      lab.className = "opt";
      lab.setAttribute("data-idx", String(origIdx));
      const inp = document.createElement("input");
      inp.type = isMulti ? "checkbox" : "radio";
      inp.name = "opt";
      inp.value = String(origIdx);
      const saved = state.answers[q.id] || [];
      if (Array.isArray(saved) && saved.includes(origIdx)) inp.checked = true;

      inp.addEventListener("change", () => {
        const selected = getSelectedOptionIndices();
        state.answers[q.id] = selected;
        saveState();
      });

      const span = document.createElement("div");
      span.textContent = optText;

      lab.appendChild(inp);
      lab.appendChild(span);
      opts.appendChild(lab);
    });
    card.appendChild(opts);

    if (state.checked[q.id] !== undefined) {
      showResultForCurrent(false);
    }
  }

  saveState();
}

function escapeHtml(str) {
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function showResultForCurrent(showCorrectOnly=false) {
  const q = currentQ();
  const status = document.getElementById("status");
  const answerBox = document.getElementById("answerBox");

  if (q.type === "matching") {
    const picked = state.answers[q.id] || Array(q.left.length).fill(null);
    const isComplete = picked.every(v => v !== null && v !== undefined);
    const correct = isComplete && arraysEqual(picked, q.correctMap);
    if (!showCorrectOnly) {
      state.checked[q.id] = correct;
      saveState();
    }
    status.className = "status " + (correct ? "ok" : "bad");
    status.textContent = showCorrectOnly ? "" : (correct ? "Верно ✅" : (isComplete ? "Неверно ❌" : "Выберите вариант в каждой строке"));
    // highlight by coloring selects
    const selects = Array.from(document.querySelectorAll("select[data-row]"));
    selects.forEach((sel) => {
      sel.style.outline = "none";
      sel.style.borderColor = "var(--border)";
      const row = parseInt(sel.getAttribute("data-row"),10);
      const should = q.correctMap[row];
      if (showCorrectOnly) {
        sel.value = String(should);
        sel.style.borderColor = "rgba(34,197,94,.65)";
        return;
      }
      const cur = sel.value === "" ? null : parseInt(sel.value,10);
      if (cur === null) return;
      if (cur === should) sel.style.borderColor = "rgba(34,197,94,.65)";
      else sel.style.borderColor = "rgba(239,68,68,.65)";
    });

    answerBox.style.display = "block";
    const lines = q.pairs.map(([l,r]) => `<div><span class="muted">${escapeHtml(l)}</span> → <b>${escapeHtml(r)}</b></div>`).join("");
    answerBox.innerHTML = `<div class="muted small">Правильные соответствия:</div>${lines}`;
    return;
  }

  const selected = state.answers[q.id] || [];
  const selSorted = Array.isArray(selected) ? [...selected].sort((a,b)=>a-b) : [];
  const correctSorted = [...q.correct].sort((a,b)=>a-b);

  const correct = arraysEqual(selSorted, correctSorted);
  if (!showCorrectOnly) {
    state.checked[q.id] = correct;
    saveState();
  }

  if (showCorrectOnly) {
    setOptionHighlights(q, selSorted, true);
    status.className = "status";
    status.textContent = "";
  } else {
    setOptionHighlights(q, selSorted, false);
    status.className = "status " + (correct ? "ok" : "bad");
    status.textContent = selected.length ? (correct ? "Верно ✅" : "Неверно ❌") : "Выберите вариант(ы)";
  }

  answerBox.style.display = "block";
  const correctText = q.correct.map(i => q.options[i]).join("; ");
  answerBox.innerHTML = `<div class="muted small">Правильный ответ:</div><div><b>${escapeHtml(correctText || "—")}</b></div>`;
  saveState();
}

document.getElementById("prevBtn").addEventListener("click", () => {
  idx = Math.max(0, idx - 1);
  render();
});
document.getElementById("nextBtn").addEventListener("click", () => {
  idx = Math.min(quiz.length - 1, idx + 1);
  render();
});
document.getElementById("checkBtn").addEventListener("click", () => {
  showResultForCurrent(false);
});
document.getElementById("showBtn").addEventListener("click", () => {
  showResultForCurrent(true);
});
document.getElementById("jumpBtn").addEventListener("click", () => {
  const n = parseInt(document.getElementById("jump").value, 10);
  if (!Number.isFinite(n) || n < 1 || n > 152) return;
  const pos = state.order.indexOf(n);
  if (pos < 0) return;
  idx = pos;
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!confirm("Сбросить весь прогресс и ответы?")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = {answers: {}, checked: {}, optOrder: {}, matchOrder: {}};
  state.order = quiz.map(q => q.id);
  shuffleInPlace(state.order);
  idx = 0;
  render();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") {
    idx = Math.max(0, idx - 1);
    render();
  } else if (e.key === "ArrowRight") {
    idx = Math.min(quiz.length - 1, idx + 1);
    render();
  } else if (e.key === "Enter") {
    showResultForCurrent(false);
  }
});

render();
</script>
</body>
</html>
